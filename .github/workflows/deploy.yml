name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty"
            exit 1
          fi
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}, account length: ${#CLOUDFLARE_ACCOUNT_ID}"
          npx --yes wrangler@4 pages deploy out \
            --project-name=agentguard-web \
            --branch=main \
            --commit-dirty=true \
            --commit-message="${{ github.event.head_commit.message || github.event_name }}"
